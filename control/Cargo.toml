[package]
name = "wayline-control"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false
autobenches = false

[[bin]]
name = "wayline-ctl"
path = "src/main.rs"
test = true
bench = false

[dependencies]
wayline-protocol.workspace = true
wayline-support.workspace = true
anyhow.workspace = true
rustix = { workspace = true, features = ["process", "fs"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
tempfile.workspace = true
arrow-array = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false, features = ["zstd"] }
arrow-schema = { version = "60", default-features = false }
bytes = "1"
parquet = { version = "60", default-features = false, features = ["zstd"] }

[lints]
workspace = true
