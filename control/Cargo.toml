[package]
name = "wayline-control"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false
autobenches = false

[[bin]]
name = "wayline-ctl"
path = "src/main.rs"
test = false
bench = false

[dependencies]
wayline-support = { path = "../support" }
anyhow = "1"
serde_json = "=1.0.154"
serde = { version = "1", features = ["derive"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process", "fs"] }
tempfile = "3"
semver = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true
