<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wayline · UI preview</title>
    <meta name="description" content="Interactive Wayline dashboard with synthetic tunnel data." />
    <style>
      :root {
        --background-color: #f4f6f8;
        --card-background-color: #fff;
        --text-color: #253644;
        --label-color: #5a6d78;
        --table-border: #e3e9ed;
        --primary-color: #159b9b;
        --preview-header: #0b6b6b;
        --preview-header-text: #fff;
        --preview-active: #edf8f8;
        --preview-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html,
      body {
        overflow-x: clip;
      }
      body {
        margin: 0;
        background: var(--background-color);
        color: var(--text-color);
        font-family: var(--preview-font);
      }
      .router-header {
        min-height: 58px;
        background: var(--preview-header);
        color: var(--preview-header-text);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 26px;
        gap: 16px;
        flex-wrap: wrap;
      }
      .router-header strong {
        font-size: 22px;
        letter-spacing: 0.01em;
      }
      .router-header a {
        color: inherit;
      }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      .router-header nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 12px 0;
      }
      .router-header span {
        font-size: 13px;
        opacity: 0.9;
      }
      .router-layout {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        min-height: calc(100vh - 58px);
      }
      aside {
        background: var(--card-background-color);
        border-right: 1px solid var(--table-border);
        padding: 25px 14px;
        color: var(--label-color);
        font-size: 14px;
      }
      aside div {
        padding: 11px 16px;
      }
      aside .active {
        color: var(--preview-header);
        background: var(--preview-active);
        border-radius: 5px;
      }
      aside .sub {
        font-size: 13px;
        padding-left: 31px;
      }
      .router-layout > main {
        padding: 26px 34px;
        min-width: 0;
      }
      @media (max-width: 850px) {
        .router-layout {
          grid-template-columns: 1fr;
        }
        aside {
          display: none;
        }
        .router-layout > main {
          padding: 16px 14px;
        }
        .router-header {
          padding: 0 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="router-header">
      <strong>GL.iNet</strong>
      <nav aria-label="Preview scenarios">
        <span>Synthetic preview</span>
        <a href="?">Full</a>
        <a href="?compat=monitoring">Monitoring</a>
        <a href="?compat=newer">Newer</a>
        <a href="?compat=unsupported">Unsupported</a>
        <a href="?fail=1">Read fails</a>
      </nav>
    </header>
    <div class="router-layout">
      <aside aria-label="Router navigation">
        <div>Internet</div>
        <div>Wireless</div>
        <div>Clients</div>
        <div>VPN</div>
        <div class="sub">VPN Dashboard</div>
        <div class="sub active">Wayline</div>
        <div>Applications</div>
        <div>Network</div>
        <div>System</div>
      </aside>
      <div id="app"></div>
    </div>
    <script src="../node_modules/vue/dist/vue.runtime.min.js"></script>
    <script>
      var module = { exports: {} };
      function require(name) {
        if (name === 'vue') return Vue;
        throw Error('Unexpected dependency: ' + name);
      }
    </script>
    <script src="../dist/gl-sdk4-ui-wayline.common.js"></script>
    <script src="demo.js"></script>
    <script>
      Vue.prototype.$rpcRequest = window.previewRpc;
      new Vue({
        render: (h) => h(module.exports, { props: { preview: true } }),
      }).$mount('#app');
    </script>
  </body>
</html>
