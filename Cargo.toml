[package]
name = "waylined"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.89"
publish = false
autotests = false
autobenches = false

[[bin]]
name = "waylined"
path = "src/main.rs"
test = false
bench = false

[dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
socket2 = { version = "=0.6.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
netlink-packet-core = "=0.9.0"
pnet_packet = { version = "=0.35.0", default-features = false }

monoio = { version = "=0.2.4", default-features = false, features = ["legacy"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
debug = 0
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[workspace]
members = ["xtask", "control", "support"]
resolver = "3"

[lints]
workspace = true
