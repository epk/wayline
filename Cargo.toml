[workspace]
members = ["monitor", "control", "protocol", "support", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
wayline-protocol = { path = "protocol" }
wayline-support = { path = "support" }
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
netlink-packet-core = "=0.9.0"
rustix = { version = "=1.1.5", default-features = false, features = ["std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
socket2 = { version = "=0.6.5", features = ["all"] }
tar = "0.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "s"
debug = 0
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
strip = true
