[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false
autobenches = false

[[bin]]
name = "wayline-dev"
path = "src/main.rs"
test = false
bench = false

[dependencies]
wayline-support = { path = "../support" }
anyhow = "1"
semver = "1"
serde_json = "=1.0.154"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = "3"
tiny_http = "0.12"
walkdir = "2"

[lints]
workspace = true
